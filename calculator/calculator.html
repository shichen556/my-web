<!DOCTYPE html>

<!-- Demonstrates HTML -->

<html lang="en">

    <head>
        <meta charset="UTF-8"> <!-- Correct characters codification -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Tell to the browser to use the most recent render available -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapts the size of the page -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome import -->
        <link href="/styles.css" rel="stylesheet">
        <script src="calculator.js" defer></script>
        <title>Calculator</title>
    </head>

    <body>

        <!-- Bootstrap offcanva navbar-->
        <br>
        <br>

        <nav class="navbar bg-light fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="/index.html">Calculator</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Homepage</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                            <li class="nav-item">
                                <a class="nav-link" href="/index.html">
                                    <i class="fa-solid fa-house"></i>Home
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/contact/contact.html">
                                    <i class="fa-solid fa-circle-user"></i>My friend
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/dance/dance.html">
                                    <i class="fa-solid fa-palette"></i>Dance dance party
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/click/click.html">
                                    <i class="fa-solid fa-gamepad"></i>Catch the button
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/calculator/calculator.html">
                                    <i class="fa-solid fa-calculator"></i>Calculator
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div id="menu"></div> <!-- Loads the menu structure -->

        <div>
            <input autocomplete="off" autofocus id="query" placeholder="Here" type="text">
            <table>
                <tr>
                    <td>
                        <button id="one">1</button>
                    </td>
                    <td>
                        <button id="two">2</button>
                    </td>
                    <td>
                        <button id="three">3</button>
                    </td>

                    <td>
                        <button id="delete" onclick="del()">C</button>
                    </td>
                    <td>
                        <button id="deleteAll" onclick="deleteAll()">AC</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <button id="four">4</button>
                    </td>
                    <td>
                        <button id="five">5</button>
                    </td>
                    <td>
                        <button id="six">6</button>
                    </td>

                    <td>
                        <button id="multip">*</button>
                    </td>
                    <td>
                        <button id="divis">/</button>
                    </td>

                </tr>

                <tr>
                    <td>
                        <button id="seven">7</button>
                    </td>
                    <td>
                        <button id="eight">8</button>
                    </td>
                    <td>
                        <button id="nine">9</button>
                    </td>

                    <td>
                        <button id="addit">+</button>
                    </td>
                    <td>
                        <button id="substr">-</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <button id="zero">0</button>
                    </td>
                    <td>
                        <button id="dot">.</button>
                    </td>
                    <td>
                        <button id="equal" onclick="result()">=</button>
                    </td>
                </tr>
            </table>
        </div>
    </body>

</html>
